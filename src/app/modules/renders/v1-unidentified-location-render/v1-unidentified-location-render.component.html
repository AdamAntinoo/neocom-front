<div class="panel-orange unidentified-card">
  <div class="insets row">
    <div class="icon-spacer" aria-hidden="true"></div>
    <div class="column identity">
      <span cy-field-label="unidentifiedLocation" class="opensans-ff label"
        >UNIDENTIFIED LOCATION</span
      >
      <div class="row name-line">
        <span cy-field-value="unidentifiedLocation" class="elemental-ff place-name">{{
          getName()
        }}</span>
        <span cy-field-value="assetCount" class="elemental-ff asset-count">{{
          getAssetCount()
        }}</span>
      </div>
    </div>
  </div>
</div>
