<div id="server-info-panel" cy-section-name="server-info" class="neocom-panel panel-blue server-info-panel">
  <div class="field">
    <span cy-field-value="server-name" class="server-name">{{ getServerName() }}</span>
    <span cy-field-value="server-online" class="server-online">{{ getOnlineLabel() }}</span>
  </div>
  <div class="field">
    <span class="label">Capsuleers</span>
    <span cy-field-value="players-count">{{ getPlayersCount() }}</span>
  </div>
  <div class="field">
    <span class="label">Backend</span>
    <span cy-field-value="backend-version">{{ getBackendVersion() }}</span>
  </div>
  <div class="field">
    <span class="label">SDE</span>
    <span cy-field-value="sde-version">{{ getSDEVersion() }}</span>
  </div>
  <div class="field">
    <span class="label">Next DT</span>
    <span cy-field-value="next-downtime">{{ getNextDowntime() }}</span>
  </div>
</div>
