<div
  id="server-info-panel"
  cy-section-name="server-info"
  class="neocom-panel panel-blue server-info-panel"
>
  <div class="row line name-line">
    <span cy-field-value="server-name" class="elemental-ff server-name">{{ getServerName() }}</span>
    <span cy-field-value="server-online" class="elemental-ff server-online">{{
      getOnlineLabel()
    }}</span>
  </div>
  <div class="row line metric-line">
    <span class="opensans-ff label">CAPSULEERS</span>
    <span class="values">
      <span cy-field-value="sde-version" class="opensans-ff value">{{ getSDEVersion() }}</span>
      <span cy-field-value="players-count" class="opensans-ff value">{{ getPlayersCount() }}</span>
    </span>
  </div>
  <div class="row line metric-line">
    <span class="opensans-ff label">NEXT DT</span>
    <span cy-field-value="next-downtime" class="opensans-ff value">{{ getNextDowntime() }}</span>
  </div>
</div>
