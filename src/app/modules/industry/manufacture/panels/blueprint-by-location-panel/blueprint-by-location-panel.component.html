<div cy-section-name="blueprint-by-location" class="panel-white hierarchy">
  <neocom-viewer-panel
    [nodes2render]="getNodes2Render()"
    [variant]="getVariant()"
    [downloader]="this"
    [selectOnHover]="false"
  />
  @if (!isDownloading() && getNodes2Render().length === 0) {
    <p class="empty-hint" cy-section-name="blueprint-by-location-empty">
      No blueprints with a location chain yet. NeoCom list/SSE must include region and system names
      for the Region → System → Blueprint tree.
    </p>
  }
</div>
