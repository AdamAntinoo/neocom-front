<div cy-section-name="assets-by-location" class="hierarchy">
  <neocom-viewer-panel
    [nodes2render]="getNodes2Render()"
    [variant]="getVariant()"
    [downloader]="this"
    [selectOnHover]="false"
  />
  @if (!isDownloading() && loadFailed()) {
    <p class="empty-hint" cy-section-name="assets-by-location-load-failed">
      Could not load pilot assets. Check NeoCom back / network, then reload.
    </p>
  } @else if (!isDownloading() && getNodes2Render().length === 0) {
    <p class="empty-hint" cy-section-name="assets-by-location-none">
      No assets returned for this pilot.
    </p>
  }
</div>
