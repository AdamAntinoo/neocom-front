<section cy-section-name="dashboard-home" class="column section">
  <app-page-header />
  @if (exception) {
    <div cy-section-name="exception" class="section row">
      <div>
        <div class="field">
          <span cy-field-label="exceptionTitle" class="label">EXCEPTION</span><br />
        </div>
        <div class="field">
          <span cy-field-label="exceptionTitle" class="label">TITLE</span><br />
          <span cy-field-value="exceptionTitle" class="exception-title">{{ exception.title }}</span>
        </div>
        <div class="field">
          <span cy-field-label="exceptionMessage" class="label">MESSAGE</span><br />
          <span cy-field-value="exceptionMessage" class="exception-message">{{
            exception.message
          }}</span>
        </div>
      </div>
    </div>
  } @else {
    <div class="row section pilot-corporation-row">
      <v1-pilot-panel class="panel" [identifier]="getPilotId()" />
      <v1-corporation-panel [corporationId]="corporationId()" />
    </div>
    <app-breadcrumb [crumbs]="crumbs" />
    <feature-list-panel parentId="root" />
  }
</section>
