<div cy-section-name="app-info" class="neocom-panel panel-white app-name-panel">
    <div class="row">
        <div class="field">
            <span cy-field-value="app-name" class="app-name">{{ getName() }}</span>
        </div>
        <div class="field app-version-position">
            <span cy-field-value="app-version" class="app-version">{{ getVersion() }}</span>
        </div>
    </div>
    <span cy-field-value="app-copyright" class="app-copyright">{{ getCopyright() }}</span>
</div>
