# Front CI — production compile (L2 INFRA-030 Node pin, INFRA-033 build, INFRA-035 no live back, INFRA-038 in-repo workflow).
name: Build

on:
  push:
    branches:
      - main
      - feature/**
      - feat/**
      - fix/**
      - release/**
  pull_request:
    branches:
      - main
      - feature/**
      - feat/**
      - fix/**
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # INFRA-030: Node from .nvmrc (neocom pin)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # INFRA-033: production build; NG_BUILD_SASS_EMBEDDED matches package scripts
      # INFRA-035: front-only — no live neocom-back required
      - name: Build
        env:
          NG_BUILD_SASS_EMBEDDED: "0"
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: neocom-front-dist
          path: dist/neocom-front
          retention-days: 7
          if-no-files-found: error
